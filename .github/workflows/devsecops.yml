name: DevSecOps pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      max_private_keys:
        description: "Max. claves privadas permitidas (Gitleaks)"
        default: "0"
      max_critical:
        description: "Max. CRITICAL permitidos (Trivy codigo e imagen)"
        default: "0"
      max_semgrep_error:
        description: "Max. hallazgos ERROR permitidos (Semgrep)"
        default: "0"

# Permisos minimos: el pipeline solo lee el repositorio.
permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      # Acciones fijadas por hash de commit (no por etiqueta mutable).
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Mismo laboratorio que en local: lab/docker-compose.yml + lab/.env
      - name: Escaneres (Docker Compose)
        run: bash lab/run-all.sh

      - name: Semgrep sobre el propio pipeline (.github)
        working-directory: lab
        run: docker compose run --rm -T semgrep-self

      - name: Resumen de resultados
        if: always()
        run: python3 lab/resumen.py >> "$GITHUB_STEP_SUMMARY"

      # shell: bash => bash -eo pipefail, para que el exit 1 de Python no se pierda tras el tee
      - name: Quality gate (politica de seguridad)
        shell: bash
        env:
          MAX_PRIVATE_KEYS: ${{ inputs.max_private_keys || '0' }}
          MAX_CRITICAL: ${{ inputs.max_critical || '0' }}
          MAX_SEMGREP_ERROR: ${{ inputs.max_semgrep_error || '0' }}
        run: |
          python3 - << 'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os, sys
          R = "lab/results/"
          MAX_PRIVATE_KEYS = int(os.environ["MAX_PRIVATE_KEYS"])
          MAX_CRITICAL_CODE = int(os.environ["MAX_CRITICAL"])
          MAX_CRITICAL_IMAGE = int(os.environ["MAX_CRITICAL"])
          MAX_SEMGREP_ERROR = int(os.environ["MAX_SEMGREP_ERROR"])
          MAX_PIPELINE_FINDINGS = 0
          def crit(f):
              d = json.load(open(R + f))
              v = [x for r in d.get("Results", []) for x in (r.get("Vulnerabilities") or [])]
              return sum(1 for x in v if x["Severity"] == "CRITICAL")
          keys = sum(1 for x in json.load(open(R + "gitleaks.json")) if x["RuleID"] == "private-key")
          sem = sum(1 for x in json.load(open(R + "semgrep.json"))["results"] if x["extra"]["severity"] == "ERROR")
          own = len(json.load(open(R + "semgrep-self.json"))["results"])
          checks = [
              ("Secretos: claves privadas (Gitleaks)", keys, MAX_PRIVATE_KEYS),
              ("Dependencias: CRITICAL (Trivy, código)", crit("trivy-fs.json"), MAX_CRITICAL_CODE),
              ("Imagen: CRITICAL (Trivy, contenedor)", crit("trivy-image.json"), MAX_CRITICAL_IMAGE),
              ("SAST: severidad ERROR (Semgrep)", sem, MAX_SEMGREP_ERROR),
              ("Pipeline: hallazgos de Semgrep en .github", own, MAX_PIPELINE_FINDINGS),
          ]
          print()
          print("## Quality gate")
          print()
          print("| Control | Encontrado | Máximo permitido | Resultado |")
          print("|---|---|---|---|")
          fail = False
          for name, found, limit in checks:
              ok = found <= limit
              fail = fail or not ok
              print(f"| {name} | {found} | {limit} | {'OK' if ok else 'BLOQUEA'} |")
          print()
          print("**Veredicto: " + ("PIPELINE BLOQUEADO" if fail else "PIPELINE APROBADO") + "**")
          sys.exit(1 if fail else 0)
          PY

      - name: Subir informes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: informes-seguridad
          path: lab/results/