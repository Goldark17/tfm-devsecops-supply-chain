name: DevSecOps pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  JUICE_SHOP_REPO: https://github.com/juice-shop/juice-shop.git
  JUICE_SHOP_COMMIT: 717f5efa886b0417eeecb52378b03cf10567b7e2
  JUICE_SHOP_IMAGE: bkimminich/juice-shop@sha256:42843723a7bf4246aa5d63c324978b17ef296ac78434aeddd34c427bfb5853f4
  GITLEAKS_IMAGE: zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # 8.30.1
  SEMGREP_IMAGE: semgrep/semgrep@sha256:451b3d875c00dac7ed5db5293e584a07de11449a409c10b3c2d2652f429630b6 # 1.182.1
  TRIVY_IMAGE: aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c # 0.76.1
  SYFT_IMAGE: anchore/syft@sha256:697ae864af1299cfa43c54b161cea3dd65c6d54de82e3dba66ea3dccb3acc313 # 1.56.0

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar objetivo (Juice Shop en commit fijo)
        run: |
          mkdir -p lab/results
          git init lab/target/juice-shop
          git -C lab/target/juice-shop fetch --depth 1 "$JUICE_SHOP_REPO" "$JUICE_SHOP_COMMIT"
          git -C lab/target/juice-shop checkout FETCH_HEAD
          echo "herramienta,milisegundos" > lab/results/tiempos.csv

      - name: Gitleaks (secretos)
        run: |
          s=$(date +%s%N)
          docker run --rm \
            -v "$PWD/lab/target/juice-shop:/path" \
            -v "$PWD/lab/results:/results" \
            "$GITLEAKS_IMAGE" dir /path --redact --exit-code 0 \
            --report-format json --report-path /results/gitleaks.json
          e=$(date +%s%N); echo "gitleaks,$(( (e-s)/1000000 ))" >> lab/results/tiempos.csv

      - name: Semgrep (SAST)
        run: |
          s=$(date +%s%N)
          docker run --rm \
            -v "$PWD/lab/target/juice-shop:/src" \
            -v "$PWD/lab/results:/results" \
            "$SEMGREP_IMAGE" semgrep scan \
            --config p/javascript --config p/typescript --config p/owasp-top-ten \
            --metrics=off --json -o /results/semgrep.json /src
          e=$(date +%s%N); echo "semgrep,$(( (e-s)/1000000 ))" >> lab/results/tiempos.csv

      - name: Generar lockfile y descargar base de datos de Trivy
        run: |
          docker run --rm -v "$PWD/lab/target/juice-shop:/app" -w /app node:22 \
            npm install --package-lock-only --package-lock=true --ignore-scripts --legacy-peer-deps
          docker run --rm -v trivy-cache:/root/.cache \
            "$TRIVY_IMAGE" image --download-db-only

      - name: Trivy (dependencias del codigo)
        run: |
          s=$(date +%s%N)
          docker run --rm \
            -v trivy-cache:/root/.cache \
            -v "$PWD/lab/target/juice-shop:/src" \
            -v "$PWD/lab/results:/results" \
            "$TRIVY_IMAGE" fs --scanners vuln --skip-db-update \
            --format json --output /results/trivy-fs.json /src
          e=$(date +%s%N); echo "trivy-fs,$(( (e-s)/1000000 ))" >> lab/results/tiempos.csv

      - name: Trivy (imagen del contenedor)
        run: |
          docker pull "$JUICE_SHOP_IMAGE"
          s=$(date +%s%N)
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache \
            -v "$PWD/lab/results:/results" \
            "$TRIVY_IMAGE" image --scanners vuln --skip-db-update \
            --format json --output /results/trivy-image.json "$JUICE_SHOP_IMAGE"
          e=$(date +%s%N); echo "trivy-image,$(( (e-s)/1000000 ))" >> lab/results/tiempos.csv

      - name: Syft (SBOM)
        run: |
          s=$(date +%s%N)
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/lab/results:/results" \
            "$SYFT_IMAGE" "$JUICE_SHOP_IMAGE" \
            -o cyclonedx-json=/results/sbom-image.cdx.json
          e=$(date +%s%N); echo "syft,$(( (e-s)/1000000 ))" >> lab/results/tiempos.csv

      - name: Resumen de resultados
        if: always()
        run: |
          python3 - << 'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, collections, csv
          R = "lab/results/"
          t = {r["herramienta"]: int(r["milisegundos"]) / 1000 for r in csv.DictReader(open(R + "tiempos.csv"))}
          def fmt(c):
              return ", ".join(f"{k}: {v}" for k, v in c.most_common())
          def trivy(f):
              d = json.load(open(R + f))
              v = [x for r in d.get("Results", []) for x in (r.get("Vulnerabilities") or [])]
              return len(v), fmt(collections.Counter(x["Severity"] for x in v))
          print("## Resultados del pipeline")
          print()
          print("| Herramienta | Hallazgos | Detalle | Tiempo (s) |")
          print("|---|---|---|---|")
          g = json.load(open(R + "gitleaks.json"))
          print(f"| Gitleaks | {len(g)} | {fmt(collections.Counter(x['RuleID'] for x in g))} | {t['gitleaks']:.1f} |")
          s = json.load(open(R + "semgrep.json"))["results"]
          print(f"| Semgrep | {len(s)} | {fmt(collections.Counter(x['extra']['severity'] for x in s))} | {t['semgrep']:.1f} |")
          n, det = trivy("trivy-fs.json")
          print(f"| Trivy (código) | {n} | {det} | {t['trivy-fs']:.1f} |")
          n, det = trivy("trivy-image.json")
          print(f"| Trivy (imagen) | {n} | {det} | {t['trivy-image']:.1f} |")
          c = json.load(open(R + "sbom-image.cdx.json"))["components"]
          lib = sum(1 for x in c if x["type"] == "library")
          print(f"| Syft (SBOM) | {lib} | librerías, de {len(c)} entradas | {t['syft']:.1f} |")
          PY

      - name: Quality gate (politica de seguridad)
        run: |
          python3 - << 'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, sys
          R = "lab/results/"
          MAX_PRIVATE_KEYS = 0
          MAX_CRITICAL_CODE = 0
          MAX_CRITICAL_IMAGE = 0
          MAX_SEMGREP_ERROR = 0
          def crit(f):
              d = json.load(open(R + f))
              v = [x for r in d.get("Results", []) for x in (r.get("Vulnerabilities") or [])]
              return sum(1 for x in v if x["Severity"] == "CRITICAL")
          keys = sum(1 for x in json.load(open(R + "gitleaks.json")) if x["RuleID"] == "private-key")
          sem = sum(1 for x in json.load(open(R + "semgrep.json"))["results"] if x["extra"]["severity"] == "ERROR")
          checks = [
              ("Secretos: claves privadas (Gitleaks)", keys, MAX_PRIVATE_KEYS),
              ("Dependencias: CRITICAL (Trivy, código)", crit("trivy-fs.json"), MAX_CRITICAL_CODE),
              ("Imagen: CRITICAL (Trivy, contenedor)", crit("trivy-image.json"), MAX_CRITICAL_IMAGE),
              ("SAST: severidad ERROR (Semgrep)", sem, MAX_SEMGREP_ERROR),
          ]
          print()
          print("## Quality gate")
          print()
          print("| Control | Encontrado | Máximo permitido | Resultado |")
          print("|---|---|---|---|")
          fail = False
          for name, found, limit in checks:
              ok = found <= limit
              fail = fail or not ok
              print(f"| {name} | {found} | {limit} | {'OK' if ok else 'BLOQUEA'} |")
          print()
          print("**Veredicto: " + ("PIPELINE BLOQUEADO" if fail else "PIPELINE APROBADO") + "**")
          sys.exit(1 if fail else 0)
          PY

      - name: Subir informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-seguridad
          path: lab/results/